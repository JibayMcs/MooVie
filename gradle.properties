# 5 Go, et c'est l'édition de liens Kotlin/Native en **release** qui les demande.
#
# `linkReleaseFrameworkIosArm64` tourne dans le démon Gradle lui-même — la trace
# de l'OutOfMemoryError est entièrement dans `org.gradle.launcher.daemon` — et
# non dans le démon Kotlin, qui ne sert qu'aux cibles JVM. Une release Native
# optimise tout le graphe d'un seul tenant, Compose et son moteur de rendu
# compris, là où le `linkDebugFramework` de `ci-ios.yml` tient dans 2 Go : c'est
# pourquoi la vérification iOS restait verte pendant que la release échouait.
#
# Le plafond vaut pour tous les builds, sans rien leur coûter : les cibles JVM
# n'en approchent pas. Il reste sous les 7 Go du runner macOS, de quoi laisser
# respirer xcodebuild.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
