org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Tas du démon Kotlin, déclaré à part de celui de Gradle.
#
# Sans cette ligne il hérite des 2 Go ci-dessus, et `linkReleaseFrameworkIosArm64`
# meurt en OutOfMemoryError : l'édition de liens Kotlin/Native en release traite
# tout le graphe d'un coup, Compose et son moteur de rendu compris, là où les
# cibles JVM compilent fichier par fichier. Mesuré sur le runner macOS de la CI,
# où le seul artefact manquant de la v1.23.0-rc.1 fut le .ipa.
#
# C'est un plafond, pas une réservation : les builds Android et desktop, qui
# n'en approchent pas, ne consomment pas un octet de plus.
kotlin.daemon.jvmargs=-Xmx4g
