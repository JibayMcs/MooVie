name: Release

# Publie à chaque tag vX.Y.Z : APK Android signé + paquets desktop natifs
# (deb Linux, msi Windows, dmg macOS) sur la même GitHub Release.
# L'auto-updater in-app (Android et desktop) lit releases/latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Notes de release construites depuis les commits conventionnels du tag.
  # `generate_release_notes` seul ne produisait qu'un « Full Changelog » : les
  # notes automatiques de GitHub listent les *pull requests* fusionnées, or on
  # pousse directement sur main. Le contenu doit donc venir des commits.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.build.outputs.notes }}
    steps:
      # Historique complet : sans lui, impossible de retrouver le tag précédent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire les notes
        id: build
        run: bash .github/scripts/changelog.sh >> "$GITHUB_OUTPUT"

  apk:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Décoder le keystore
        run: echo "${{ secrets.MOOVIE_KEYSTORE_B64 }}" | base64 -d > moovie-release.keystore

      - name: Build APK release signé
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: moovie-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MOOVIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOOVIE_KEY_ALIAS }}

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk moovie-${{ github.ref_name }}.apk

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.apk
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true

  desktop:
    needs: changelog
    strategy:
      # Un OS en échec ne bloque pas les autres paquets.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: macos-latest
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build paquet desktop (${{ matrix.ext }})
        run: ./gradlew packageDistributionForCurrentOS --no-daemon

      - name: Renommer le paquet
        shell: bash
        run: |
          src=$(find app/build/compose/binaries -name "*.${{ matrix.ext }}" | head -1)
          cp "$src" "moovie-${{ github.ref_name }}.${{ matrix.ext }}"

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.${{ matrix.ext }}
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true

  # Linux passe par un AppImage : il embarque ses bibliothèques, tourne sur
  # n'importe quelle distribution et, étant un fichier unique chez
  # l'utilisateur, permet la mise à jour depuis l'app. Le .deb qu'il remplace
  # ne couvrait qu'Ubuntu et avait déjà été livré une fois avec une dépendance
  # (libpcre3) absente de la distribution cible.
  #
  # Build dans un conteneur 22.04 et non sur ubuntu-latest : la glibc n'est
  # compatible que vers l'avant, une image construite sur 24.04 ne démarrerait
  # pas sur les distributions plus anciennes.
  appimage:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Dépendances de build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # binutils : jlink appelle objcopy pour --strip-debug, et un conteneur
          # nu ne l'a pas — contrairement à un poste de développement.
          # vlc-plugin-base / libvlc5 / libvlccore9 : source de la libVLC et des
          # plugins embarqués dans l'AppImage. Sans eux, packageAppImage échoue
          # explicitement plutôt que de livrer une image qui exigerait un
          # « apt install vlc » chez l'utilisateur.
          apt-get install -y openjdk-17-jdk binutils curl file zsync git ca-certificates \
            libvlc5 libvlccore9 vlc-plugin-base

      - uses: actions/checkout@v4

      # Le runtime embarqué ne peut pas être Temurin : libVLC part en SIGSEGV
      # dans son démuxeur adaptive dès le démarrage d'une lecture (reproduit
      # 7/7, absent avec l'OpenJDK de la distribution).
      - name: Construire l'AppImage
        env:
          MOOVIE_JPACKAGE_JDK: /usr/lib/jvm/java-17-openjdk-amd64
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          # Sans locale UTF-8, la JVM d'un conteneur nu décode en ASCII et
          # jpackage échoue sur le tiret cadratin de la description
          # (« Input length = 1 »).
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: ./gradlew :app:packageAppImage --no-daemon

      - name: Renommer
        run: |
          src=$(find app/build/compose/binaries/main/appimage -name '*.AppImage' | head -1)
          cp "$src" "moovie-${{ github.ref_name }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: moovie-appimage
          path: moovie-*.AppImage
          retention-days: 1

  # L'AppImage ne part en release qu'après avoir prouvé qu'elle démarre sur
  # plusieurs distributions. --appimage-extract-and-run évite d'exiger FUSE,
  # absent des conteneurs. Sans DISPLAY l'app lève une HeadlessException : cela
  # prouve que le runtime embarqué et notre main ont bien été atteints, ce qui
  # est tout ce qu'on peut vérifier sans écran.
  verify-appimage:
    needs: appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'archlinux:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moovie-appimage

      # L'AppImage embarque ses bibliothèques sauf la pile graphique et le son :
      # libGL et libX* sont couplées au pilote GPU et au serveur graphique, on ne
      # les bundle jamais. Toute session de bureau les fournit ; un conteneur nu
      # non, d'où cette installation pour rendre l'environnement représentatif.
      - name: Pile graphique minimale
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v pacman >/dev/null; then
            pacman -Sy --noconfirm libgl libx11 libxext libxi libxrender libxtst alsa-lib \
              libxcb
          else
            apt-get update
            apt-get install -y libgl1 libx11-6 libxext6 libxi6 libxrender1 libxtst6 \
              libxcb-render0 libxcb-shm0 \
              || true
            apt-get install -y libasound2t64 || apt-get install -y libasound2
          fi

      # libVLC est désormais embarquée : aucune de ces distributions n'a VLC
      # installé, donc si une dépendance manquait, la lecture casserait chez
      # l'utilisateur sans que le démarrage ne le révèle. On vérifie donc
      # séparément que la fermeture ELF de libVLC et de ses plugins se résout.
      - name: Dépendances de libVLC embarquée sur ${{ matrix.image }}
        run: |
          chmod +x moovie-*.AppImage
          ./moovie-*.AppImage --appimage-extract >/dev/null
          export LD_LIBRARY_PATH=squashfs-root/usr/lib/bundled
          miss=0
          for so in squashfs-root/usr/lib/bundled/libvlc.so.5 \
                    $(find squashfs-root/usr/lib/vlc/plugins -name '*.so'); do
            out=$(ldd "$so" 2>/dev/null | grep 'not found' || true)
            if [ -n "$out" ]; then
              miss=$((miss+1))
              basename "$so" >> /tmp/failing
              echo "$(basename $so): $(echo "$out" | awk '{print $1}' | sort -u | tr '\n' ' ')"
            fi
          done
          touch /tmp/failing
          echo "plugins en défaut : $miss"
          # libpulse est volontairement non embarquée (son protocole est couplé
          # au démon audio de l'hôte) : ses plugins peuvent manquer, VLC bascule
          # alors sur ALSA. Tout autre plugin en défaut est une régression.
          [ -z "$(grep -v '^libpulse' /tmp/failing || true)" ] || {
            echo "des plugins autres que pulse ont une dépendance manquante"
            exit 1
          }
          # Assertion explicite sur le plugin critique : sans lui, aucun
          # décodage H.264/HEVC, et l'app se contenterait d'un écran noir.
          ldd squashfs-root/usr/lib/vlc/plugins/codec/libavcodec_plugin.so \
            | grep 'not found' && { echo "libavcodec_plugin incomplet"; exit 1; }
          echo "libavcodec_plugin : toutes ses dépendances résolues."

      - name: Démarrage sur ${{ matrix.image }}
        run: |
          chmod +x moovie-*.AppImage
          out=$(./moovie-*.AppImage --appimage-extract-and-run 2>&1 || true)
          echo "$out" | head -20
          echo "$out" | grep -q "HeadlessException" || {
            echo "L'app n'a pas atteint son point d'entrée sur ${{ matrix.image }}."
            exit 1
          }
          echo "Démarrage confirmé sur ${{ matrix.image }}."

  publish-appimage:
    needs: [verify-appimage, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moovie-appimage

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.AppImage
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
