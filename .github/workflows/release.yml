name: Release APK

# Publie un APK signé en GitHub Release à chaque tag vX.Y.Z.
# L'auto-updater in-app lit releases/latest pour proposer la mise à jour.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Décoder le keystore
        run: echo "${{ secrets.MOOVIE_KEYSTORE_B64 }}" | base64 -d > moovie-release.keystore

      - name: Build APK release signé
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: moovie-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MOOVIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOOVIE_KEY_ALIAS }}

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk moovie-${{ github.ref_name }}.apk

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.apk
          generate_release_notes: true
