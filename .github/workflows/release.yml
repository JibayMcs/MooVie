name: Release

# Publie à chaque tag vX.Y.Z : APK Android signé + paquets desktop natifs
# (AppImage Linux, msi Windows, dmg macOS) + .ipa iOS non signé, sur la même
# GitHub Release.
# L'auto-updater in-app (Android et desktop) lit releases/latest. iOS n'en a
# pas : une app iOS ne peut pas s'installer elle-même. La mise à jour y passe
# par SideStore, qui lit la source JSON publiée à côté du .ipa.
#
# Un tag qui porte un suffixe semver de préversion — `v1.15.0-rc.1` — sort en
# **pré-release**. C'est ce qui met une version à l'épreuve sans l'imposer :
# l'API GitHub définit `releases/latest` comme la dernière release *non*
# préversion, donc l'updater intégré ne la voit pas et aucune bannière ne
# s'affiche chez les utilisateurs installés. Les testeurs, eux, l'installent à
# la main depuis la page des releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Notes de release construites depuis les commits conventionnels du tag.
  # `generate_release_notes` seul ne produisait qu'un « Full Changelog » : les
  # notes automatiques de GitHub listent les *pull requests* fusionnées, or on
  # pousse directement sur main. Le contenu doit donc venir des commits.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.build.outputs.notes }}
    steps:
      # Historique complet : sans lui, impossible de retrouver le tag précédent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire les notes
        id: build
        run: bash .github/scripts/changelog.sh >> "$GITHUB_OUTPUT"

  apk:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Décoder le keystore
        run: echo "${{ secrets.MOOVIE_KEYSTORE_B64 }}" | base64 -d > moovie-release.keystore

      - name: Build APK release signé
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: moovie-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MOOVIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOOVIE_KEY_ALIAS }}
          # Clé de consumer OpenSubtitles : elle identifie l'application, doit
          # donc être présente dans les binaires publiés, mais jamais dans le
          # dépôt. Absente, les sous-titres se désactivent proprement.
          OPENSUBTITLES_API_KEY: ${{ secrets.MOOVIE_OPENSUBTITLES_KEY }}

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk moovie-${{ github.ref_name }}.apk

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.apk
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
          # Les quatre publications visent la *même* release : elles doivent
          # s'accorder sur ce marquage, sinon la dernière arrivée déclasse les
          # précédentes. D'où l'expression, identique partout, plutôt qu'une
          # valeur saisie à la main.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Une préversion ne peut pas être « latest ». On le dit explicitement
          # au lieu de compter sur le refus de l'API : c'est ce drapeau, et lui
          # seul, qui protège les utilisateurs installés d'une bannière.
          make_latest: ${{ !contains(github.ref_name, '-') }}

  desktop:
    needs: changelog
    strategy:
      # Un OS en échec ne bloque pas les autres paquets.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: macos-latest
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # libmpv embarquée dans le paquet, comme elle l'est dans l'AppImage.
      # Sans elle, Windows et macOS installeraient une application sans
      # lecteur : c'est exactement la panne de la 1.18.0, où ces deux
      # plateformes attendaient un VLC système qui n'était pas là.
      #
      # Le fichier atterrit dans `app/resources/<plateforme>`, que Compose
      # dépose à côté de l'application et dont jpackage donne le chemin en
      # propriété système — voir `Libmpv.embarquee()`.
      - name: Embarquer libmpv (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Authentifie l'appel à l'API : en anonyme, les runners partagent une
          # IP et ses soixante requêtes horaires, et l'empaquetage Windows a
          # échoué sur « API rate limit exceeded » — une panne qui ne dépend
          # pas de nous et ne se reproduit pas à volonté. Le jeton du workflow
          # suffit à lire les releases d'un dépôt public, et fait passer la
          # limite à mille par heure.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "app/resources/windows-x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # L'archive est **résolue par l'API**, jamais écrite en dur : le nom
          # du fichier de shinchiro porte sa date et le hash du commit mpv, si
          # bien qu'une URL figée cesse d'exister à la publication suivante.
          $api = "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases"
          $headers = @{ "User-Agent" = "moovie-ci"; "Authorization" = "Bearer $env:GH_TOKEN" }
          # Trois essais espacés : le quota se compte à l'heure, mais un refus
          # ponctuel du réseau n'a pas à coûter une release entière.
          $rel = $null
          foreach ($essai in 1..3) {
            try {
              $rel = Invoke-RestMethod -Uri $api -Headers $headers
              break
            } catch {
              Write-Host "essai $essai : $($_.Exception.Message)"
              if ($essai -eq 3) { throw }
              Start-Sleep -Seconds (10 * $essai)
            }
          }
          $asset = $rel |
            ForEach-Object { $_.assets } |
            Where-Object { $_.name -like "mpv-dev-x86_64-2*.7z" } |
            Select-Object -First 1
          if (-not $asset) { throw "aucune archive mpv-dev dans les releases shinchiro" }
          Write-Host "archive : $($asset.name)"
          curl.exe -L --fail --retry 3 -o mpv-dev.7z $asset.browser_download_url
          7z x mpv-dev.7z -ompv-dev | Out-Null
          $dll = Get-ChildItem -Recurse -Filter "libmpv-2.dll" mpv-dev | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll absente de l'archive" }
          Copy-Item $dll.FullName "$dest/libmpv-2.dll"
          Get-Item "$dest/libmpv-2.dll" | Select-Object Name, Length

      # libmpv **importe statiquement** `vulkan-1.dll`, que Windows ne fournit
      # pas : elle arrive avec les pilotes GPU. Sur une machine dont la carte
      # est trop ancienne pour Vulkan — mesuré sur une Quadro 2000, pilote de
      # 2015 — le fichier n'existe nulle part, et le chargeur refuse libmpv
      # **avant d'exécuter la moindre ligne** : `LoadLibrary` rend l'erreur 126,
      # « module introuvable », en désignant la DLL qui est pourtant là.
      #
      # L'ironie est que nous n'utilisons pas Vulkan du tout : le rendu passe
      # par `MPV_RENDER_PARAM_API_TYPE = "sw"`, dans notre propre tampon. Mais
      # un import statique se résout au chargement, que le code s'en serve ou
      # non. Embarquer le loader Khronos (Apache-2.0) suffit à le satisfaire ;
      # il rendra « aucun périphérique » si on l'interrogeait, ce qui ne nous
      # concerne pas.
      #
      # Posée **à côté de libmpv** : le chargeur cherche les dépendances d'un
      # module chargé par chemin complet dans le répertoire de ce module.
      # Vérifié sur la machine en panne — `LoadLibraryW` simple passe au vert
      # dès que le fichier est là.
      - name: Embarquer le loader Vulkan (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "app/resources/windows-x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Le paquet MSYS2 plutôt que le SDK LunarG : celui-ci impose un
          # formulaire et une URL qui change à chaque version, celui-là est un
          # dépôt ouvert dont on résout le nom de fichier à la volée — même
          # discipline que pour l'archive mpv juste au-dessus.
          $base = "https://repo.msys2.org/mingw/mingw64/"
          $index = $null
          foreach ($essai in 1..3) {
            try { $index = (Invoke-WebRequest -Uri $base -UseBasicParsing).Content; break }
            catch {
              Write-Host "essai $essai : $($_.Exception.Message)"
              if ($essai -eq 3) { throw }
              Start-Sleep -Seconds (10 * $essai)
            }
          }
          $paquet = [regex]::Matches($index, 'mingw-w64-x86_64-vulkan-loader-[0-9][^"]*?\.pkg\.tar\.zst') |
            ForEach-Object { $_.Value } | Sort-Object -Unique | Select-Object -Last 1
          if (-not $paquet) { throw "paquet vulkan-loader introuvable sur MSYS2" }
          Write-Host "paquet : $paquet"
          curl.exe -L --fail --retry 3 -o vulkan.pkg.tar.zst "$base$paquet"
          7z x vulkan.pkg.tar.zst -ovulkan-zst | Out-Null
          7z x (Get-ChildItem -Recurse -Filter "*.tar" vulkan-zst | Select-Object -First 1).FullName -ovulkan | Out-Null
          $dll = Get-ChildItem -Recurse -Filter "vulkan-1.dll" vulkan | Select-Object -First 1
          if (-not $dll) { throw "vulkan-1.dll absente du paquet" }
          Copy-Item $dll.FullName "$dest/vulkan-1.dll"
          Get-Item "$dest/vulkan-1.dll" | Select-Object Name, Length

      - name: Embarquer libmpv (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          arch=$([ "$(uname -m)" = "arm64" ] && echo macos-arm64 || echo macos-x64)
          dest="app/resources/$arch"
          mkdir -p "$dest"
          brew install mpv
          src=$(find "$(brew --prefix)" -name 'libmpv.2.dylib' | head -1)
          [ -n "$src" ] || { echo "libmpv.2.dylib introuvable après brew install mpv"; exit 1; }
          cp "$src" "$dest/libmpv.2.dylib"
          chmod u+w "$dest/libmpv.2.dylib"
          # Les dépendances de Homebrew vivent sous /opt/homebrew, répertoire
          # absent chez l'utilisateur : il faut copier la fermeture entière et
          # réécrire chaque chemin en `@loader_path`. Ce travail est confié à
          # `dylibbundler`, dont c'est l'unique métier — une boucle maison a
          # laissé passer des références (ffmpeg, tiré par plusieurs chemins),
          # et un DMG qui s'installe sans rien jouer est le pire des résultats.
          brew install dylibbundler
          dylibbundler --bundle-deps --overwrite-files --create-dir \
            --fix-file "$dest/libmpv.2.dylib" \
            --dest-dir "$dest" --install-path "@loader_path/"
          # Son propre identifiant reste celui de Homebrew : sans effet sur le
          # chargement — JNA ouvre un chemin absolu — mais il n'a rien à faire
          # dans un paquet livré, et il fausse toute vérification qui le lit.
          install_name_tool -id "@loader_path/libmpv.2.dylib" "$dest/libmpv.2.dylib"
          codesign --force --sign - "$dest/libmpv.2.dylib"
          echo "dylibs embarquées : $(ls "$dest" | wc -l)"
          # Aucun chemin Homebrew ne doit subsister dans les **dépendances** :
          # il ne mènerait nulle part chez l'utilisateur. `otool -L` annonce
          # d'abord le fichier puis son propre identifiant : les vraies
          # dépendances commencent à la troisième ligne, et les confondre
          # faisait échouer la vérification sur un paquet pourtant correct.
          for f in "$dest"/*.dylib; do
            reste=$(otool -L "$f" | tail -n +3 | grep -E '^\s+/(opt|usr/local)/' || true)
            if [ -n "$reste" ]; then
              echo "chemins Homebrew dans $(basename "$f") :"
              echo "$reste"
              exit 1
            fi
          done
          echo "aucun chemin Homebrew dans les dépendances embarquées."

      - name: Build paquet desktop (${{ matrix.ext }})
        run: ./gradlew packageDistributionForCurrentOS --no-daemon
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.MOOVIE_OPENSUBTITLES_KEY }}

      - name: Renommer le paquet
        shell: bash
        run: |
          src=$(find app/build/compose/binaries -name "*.${{ matrix.ext }}" | head -1)
          cp "$src" "moovie-${{ github.ref_name }}.${{ matrix.ext }}"

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.${{ matrix.ext }}
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
          # Les quatre publications visent la *même* release : elles doivent
          # s'accorder sur ce marquage, sinon la dernière arrivée déclasse les
          # précédentes. D'où l'expression, identique partout, plutôt qu'une
          # valeur saisie à la main.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Une préversion ne peut pas être « latest ». On le dit explicitement
          # au lieu de compter sur le refus de l'API : c'est ce drapeau, et lui
          # seul, qui protège les utilisateurs installés d'une bannière.
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # iOS : .ipa **non signé**, destiné au sideload par SideStore.
  #
  # Non signé parce qu'une app d'extraction de sources ne passe pas la revue de
  # l'App Store : il n'y a pas de canal officiel à viser, et signer ici
  # supposerait un compte Apple Developer dont la clé privée vivrait dans les
  # secrets du dépôt. SideStore resigne à l'installation avec le certificat de
  # l'utilisateur, ce qui est de toute façon la seule signature qui vaille sur
  # son appareil — et il sait la renouveler **depuis l'appareil**, là où
  # AltStore exige un ordinateur sur le même réseau tous les sept jours.
  #
  # C'est le **seul endroit où le code Kotlin/Native est compilé** : la toolchain
  # Apple n'existe que sur macOS, un poste Linux ou Windows configure les cibles
  # iOS sans pouvoir les bâtir. Ce job est donc aussi la vérification de
  # compilation du portage.
  ipa:
    needs: changelog
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Le projet Xcode n'est pas versionné : il se génère depuis
      # iosApp/project.yml. Voir le commentaire en tête de ce fichier-là.
      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: iosApp
        run: xcodegen generate

      # CFBundleShortVersionString n'accepte que du numérique pointé : le
      # suffixe de préversion — « -rc.1 » — y est refusé, exactement comme
      # jpackage le refuse pour le MSI et le DMG. Même traitement, donc, que le
      # `jpackageVersion` de app/build.gradle.kts. Le numéro de build prend le
      # compteur du workflow, qui croît strictement.
      - name: Archiver (non signé)
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.MOOVIE_OPENSUBTITLES_KEY }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project iosApp/Moovie.xcodeproj \
            -scheme Moovie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Moovie.xcarchive" \
            MARKETING_VERSION="${version%%-*}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Un .ipa est un zip dont le seul contenu obligatoire est Payload/<app>.
      # Aucun outil n'est nécessaire pour le fabriquer, et `xcodebuild
      # -exportArchive` en exigerait un profil de provisioning — ce que
      # précisément on n'a pas.
      - name: Empaqueter le .ipa
        run: |
          set -e
          app=$(find build/Moovie.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "aucun .app dans l'archive"; exit 1; }
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "moovie-${GITHUB_REF_NAME}.ipa" Payload
          ls -lh moovie-*.ipa

      # Source SideStore : le seul mécanisme de mise à jour possible sur iOS.
      #
      # Une app iOS ne peut pas s'installer elle-même — c'est verrouillé par le
      # système, pas une API manquante. L'updater intégré des autres
      # plateformes n'a donc pas d'équivalent ici. Ce que sait faire SideStore,
      # c'est interroger périodiquement une « source » : un JSON listant les
      # versions et leurs URLs. L'utilisateur l'ajoute une fois, SideStore
      # s'occupe du reste. Le format est celui d'AltStore, dont SideStore est un
      # fork : la même source sert donc aux deux.
      #
      # L'URL de la source est **stable** parce que GitHub résout toujours
      # `releases/latest/download/<asset>` vers la dernière release non
      # préversion. Pas besoin d'une branche gh-pages ni d'un hébergement à
      # côté : le fichier voyage avec le .ipa qu'il décrit.
      - name: Construire la source SideStore
        run: |
          set -e
          ipa=$(ls moovie-*.ipa | head -1)
          taille=$(wc -c < "$ipa" | tr -d ' ')
          # **La version annoncée doit être celle que l'application déclare.**
          # SideStore compare `version` au `CFBundleShortVersionString` de l'app
          # installée, et `buildVersion` à son `CFBundleVersion` ; ce sont ces
          # deux comparaisons qui décident s'il y a du neuf.
          #
          # D'où le même `%%-*` qu'à l'archivage : `CFBundleShortVersionString`
          # n'accepte que du numérique pointé, si bien qu'un tag `v1.19.0-rc.1`
          # produit une app en « 1.19.0 ». Annoncer « 1.19.0-rc.1 » dans la
          # source ne correspondrait donc à aucune version installable, et
          # SideStore aurait proposé la même mise à jour indéfiniment.
          #
          # `buildVersion` est ce qui distingue alors deux préversions du même
          # numéro : c'est le compteur du workflow, qui croît strictement, et
          # c'est exactement ce que l'archivage met dans `CFBundleVersion`.
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          build="${GITHUB_RUN_NUMBER}"
          # Empreinte du fichier : SideStore la vérifie après téléchargement et
          # refuse un .ipa qui ne correspond pas. Elle ne coûte rien à produire
          # et transforme un téléchargement corrompu en refus explicite plutôt
          # qu'en installation qui échoue sans raison lisible.
          sha=$(shasum -a 256 "$ipa" | cut -d" " -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # `date -u` et non la date du tag : c'est la date de publication que
          # lit SideStore pour décider s'il a du neuf.
          # `app/icons/moovie.png` et non la bannière : SideStore affiche cette
          # image dans une tuile **carrée**. Une bannière pleine largeur y
          # arriverait écrasée, et c'est déjà l'icône que porte l'application.
          python3 - <<PYEOF > sidestore.json
          import json, os, datetime
          notes = os.environ.get("NOTES", "").strip() or "Voir les notes de version sur GitHub."
          print(json.dumps({
              "name": "Moo-vie",
              "identifier": "fr.moovie.sidestore",
              "apps": [{
                  "name": "Moo-vie",
                  "bundleIdentifier": "fr.moovie.tv",
                  "developerName": "Moo-vie",
                  "subtitle": "Streaming multiplateforme, sans compte ni publicite.",
                  "localizedDescription":
                      "Streaming sur Android TV, Android, desktop et iOS, "
                      "depuis une base de code Kotlin Multiplatform unique. "
                      "L'extraction des sources tourne sur l'appareil : pas de "
                      "serveur, pas de compte, pas de publicité.",
                  "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/app/icons/moovie.png",
                  "tintColor": "1B1B1F",
                  "versions": [{
                      "version": "$version",
                      "buildVersion": "$build",
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": notes,
                      "downloadURL": "$base/$ipa",
                      "size": $taille,
                      "sha256": "$sha",
                      # Compose Multiplatform exige iOS 15 ; c'est aussi la
                      # cible de déploiement du projet Xcode.
                      "minOSVersion": "15.0",
                  }],
              }],
          }, indent=2, ensure_ascii=False))
          PYEOF
          echo "source SideStore : version $version (build $build) pour $ipa ($taille octets)"
          # Relu avant publication : une source mal formée n'échoue pas ici, elle
          # échoue chez l'utilisateur, sous la forme d'une source qui refuse de
          # s'ajouter sans dire pourquoi.
          python3 -c "import json,sys; json.load(open('sidestore.json')); print('source SideStore : JSON valide')"
        env:
          NOTES: ${{ needs.changelog.outputs.notes }}

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moovie-*.ipa
            sidestore.json
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
          # Les publications visent la *même* release : elles doivent s'accorder
          # sur ce marquage, sinon la dernière arrivée déclasse les précédentes.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # Linux passe par un AppImage : il embarque ses bibliothèques, tourne sur
  # n'importe quelle distribution et, étant un fichier unique chez
  # l'utilisateur, permet la mise à jour depuis l'app. Le .deb qu'il remplace
  # ne couvrait qu'Ubuntu et avait déjà été livré une fois avec une dépendance
  # (libpcre3) absente de la distribution cible.
  #
  # Build dans un conteneur 22.04 et non sur ubuntu-latest : la glibc n'est
  # compatible que vers l'avant, une image construite sur 24.04 ne démarrerait
  # pas sur les distributions plus anciennes.
  appimage:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Dépendances de build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # binutils : jlink appelle objcopy pour --strip-debug, et un conteneur
          # nu ne l'a pas — contrairement à un poste de développement. Sert
          # aussi à `strip` les bibliothèques mpv (63 Mo de symboles).
          # bzip2 : micromamba est servi en tar.bz2.
          # La libmpv n'est plus installée par apt : elle vient de
          # tools/fetch-mpv-linux.sh, pour les raisons documentées là-bas.
          apt-get install -y openjdk-17-jdk binutils bzip2 curl file zsync git ca-certificates

      - uses: actions/checkout@v4

      # Avant le build : sans ce répertoire, `bundleMpv` retomberait sur la
      # libmpv du conteneur — 22.04 sert la 0.34.1, qui rend toute source 4K
      # cramée. Le repli est délibérément absent ici : un échec de cette étape
      # doit arrêter la release, pas produire une image dégradée en silence.
      - name: Embarquer une libmpv portable
        run: ./tools/fetch-mpv-linux.sh

      # Le runtime embarqué ne peut pas être Temurin : le décodage natif part
      # en SIGSEGV dès le démarrage d'une lecture (reproduit 7/7 sous libVLC,
      # absent avec l'OpenJDK de la distribution). La cause est le runtime et
      # non le lecteur, donc la précaution vaut aussi pour libmpv.
      - name: Construire l'AppImage
        env:
          MOOVIE_JPACKAGE_JDK: /usr/lib/jvm/java-17-openjdk-amd64
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          # Sans locale UTF-8, la JVM d'un conteneur nu décode en ASCII et
          # jpackage échoue sur le tiret cadratin de la description
          # (« Input length = 1 »).
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          OPENSUBTITLES_API_KEY: ${{ secrets.MOOVIE_OPENSUBTITLES_KEY }}
        run: ./gradlew :app:packageAppImage --no-daemon

      - name: Renommer
        run: |
          src=$(find app/build/compose/binaries/main/appimage -name '*.AppImage' | head -1)
          cp "$src" "moovie-${{ github.ref_name }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: moovie-appimage
          path: moovie-*.AppImage
          retention-days: 1

  # L'AppImage ne part en release qu'après avoir prouvé qu'elle démarre sur
  # plusieurs distributions. --appimage-extract-and-run évite d'exiger FUSE,
  # absent des conteneurs. Sans DISPLAY l'app lève une HeadlessException : cela
  # prouve que le runtime embarqué et notre main ont bien été atteints, ce qui
  # est tout ce qu'on peut vérifier sans écran.
  verify-appimage:
    needs: appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'archlinux:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moovie-appimage

      # L'AppImage embarque ses bibliothèques sauf la pile graphique et le son :
      # libGL et libX* sont couplées au pilote GPU et au serveur graphique, on ne
      # les bundle jamais. Toute session de bureau les fournit ; un conteneur nu
      # non, d'où cette installation pour rendre l'environnement représentatif.
      - name: Pile graphique minimale
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v pacman >/dev/null; then
            pacman -Sy --noconfirm libgl libx11 libxext libxi libxrender libxtst alsa-lib \
              libxcb
          else
            apt-get update
            apt-get install -y libgl1 libx11-6 libxext6 libxi6 libxrender1 libxtst6 \
              libxcb-render0 libxcb-shm0 \
              || true
            apt-get install -y libasound2t64 || apt-get install -y libasound2
          fi

      # libmpv est embarquée : aucune de ces distributions n'a mpv installé,
      # donc si une dépendance manquait, la lecture casserait chez
      # l'utilisateur sans que le démarrage ne le révèle — l'application
      # afficherait « lecteur vidéo introuvable » et rien d'autre. On vérifie
      # donc séparément que sa fermeture ELF se résout.
      - name: Dépendances de libmpv embarquée sur ${{ matrix.image }}
        run: |
          chmod +x moovie-*.AppImage
          ./moovie-*.AppImage --appimage-extract >/dev/null
          export LD_LIBRARY_PATH=squashfs-root/usr/lib/bundled
          mpv=$(ls squashfs-root/usr/lib/bundled/libmpv.so.* 2>/dev/null | head -1)
          [ -n "$mpv" ] || { echo "libmpv absente de l'AppImage"; exit 1; }
          echo "libmpv embarquée : $(basename "$mpv")"
          manquantes=$(ldd "$mpv" 2>/dev/null | grep 'not found' | awk '{print $1}' | sort -u)
          # Les familles que le bundler écarte **délibérément** ne peuvent pas
          # compter comme des manques ici, sans quoi la vérification
          # contredirait la politique d'embarquement : le son (couplé au démon
          # audio de l'hôte), le graphique et le GPU (couplés au pilote et au
          # serveur X). Toute session de bureau les fournit ; ces conteneurs de
          # test, non. Voir le `excluded` de packageAppImage — les deux listes
          # décrivent la même décision et doivent le rester.
          reste=$(echo "$manquantes" | grep -vE '^(libpulse|libasound|libEGL|libGL|libGLX|libGLdispatch|libX11|libXext|libXi|libXrender|libXtst|libXau|libXdmcp|libxcb|libdrm)' || true)
          if [ -n "$reste" ]; then
            echo "dépendances manquantes pour libmpv : $reste"
            exit 1
          fi
          echo "libmpv : toutes ses dépendances résolues."

      - name: Démarrage sur ${{ matrix.image }}
        run: |
          chmod +x moovie-*.AppImage
          out=$(./moovie-*.AppImage --appimage-extract-and-run 2>&1 || true)
          echo "$out" | head -20
          echo "$out" | grep -q "HeadlessException" || {
            echo "L'app n'a pas atteint son point d'entrée sur ${{ matrix.image }}."
            exit 1
          }
          echo "Démarrage confirmé sur ${{ matrix.image }}."

  publish-appimage:
    needs: [verify-appimage, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moovie-appimage

      - name: Publier sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: moovie-*.AppImage
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
          # Les quatre publications visent la *même* release : elles doivent
          # s'accorder sur ce marquage, sinon la dernière arrivée déclasse les
          # précédentes. D'où l'expression, identique partout, plutôt qu'une
          # valeur saisie à la main.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Une préversion ne peut pas être « latest ». On le dit explicitement
          # au lieu de compter sur le refus de l'API : c'est ce drapeau, et lui
          # seul, qui protège les utilisateurs installés d'une bannière.
          make_latest: ${{ !contains(github.ref_name, '-') }}
