name: Vérification iOS

# Ne publie **rien**. Son seul rôle est de compiler ce qu'aucun poste de
# développement sous Linux ou Windows ne peut compiler : le code Kotlin/Native
# et le projet Xcode. La toolchain Apple n'existe que sur macOS, si bien que
# `compileIosMainKotlinMetadata` est purement et simplement *skipped* ailleurs —
# vérifié, ce n'est pas une supposition. Sans ce workflow, `app/src/iosMain`
# n'est relu que par des yeux humains.
#
# Distinct de `release.yml`, qui ne se déclenche que sur un tag et publie sur la
# release : on ne veut pas taguer une version pour savoir si le code compile.
#
# Il se déclenche sur `main`, sur les pull requests et sur les branches de
# travail iOS — mais seulement quand quelque chose qui le concerne a bougé.
#
# `commonMain` fait partie de ces chemins, et c'est le point important : depuis
# le portage, l'interface partagée y vit tout entière. Un changement fait pour
# Android ou pour le desktop peut donc casser la compilation Kotlin/Native sans
# que son auteur en voie rien, et ce workflow est le seul à pouvoir le dire.
#
# Le filtre par chemins est ce qui rend ce filet supportable : une PR qui ne
# touche qu'aux sources Android ou qu'aux traductions ne paie pas ses vingt
# minutes de runner macOS.
#
# La liste est écrite deux fois, et ce n'est pas un oubli : **GitHub Actions
# n'interprète pas les ancres YAML**. Un `&ancre` / `*ancre` passerait la
# validation d'un analyseur YAML ordinaire et ne filtrerait rien ici.
on:
  push:
    branches: [main, 'ios/**', 'feat/ios-port']
    paths:
      - 'app/src/commonMain/**'
      - 'app/src/iosMain/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'iosApp/**'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    paths:
      - 'app/src/commonMain/**'
      - 'app/src/iosMain/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'iosApp/**'
      - '.github/workflows/ci-ios.yml'
  # Permet de le relancer à la main depuis l'onglet Actions, sans pousser.
  workflow_dispatch:

# Une nouvelle poussée sur la même branche annule la vérification en cours :
# personne n'attend le verdict d'un commit déjà remplacé, et un runner macOS
# occupé à le produire est un runner qui ne démarre pas le suivant.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Ce qui exige macOS, et rien d'autre.
  #
  # Mesuré sur un run complet : 169 s de métadonnées, 501 s de lien appareil,
  # 641 s de lien simulateur, 82 s de build Xcode. Le simulateur pesait donc
  # 45 % du total à lui seul, et la non-régression Android/desktop s'exécutait
  # ensuite **en série sur le même runner macOS** — la machine la plus chère du
  # catalogue, pour une compilation qui tourne sur n'importe quel Linux.
  # ---------------------------------------------------------------------------
  # Le nom reste `compiler`, et ce n'est pas de la nostalgie : la clé de cache de
  # `setup-gradle` inclut le nom du job. Le renommer jetait le cache Gradle
  # accumulé, ce qui a fait passer la compilation des métadonnées de 169 s à
  # 601 s sur le run qui a essayé — un cache froid coûte plus cher que tout ce
  # que ce fichier cherche à économiser.
  compiler:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # **Le cache que `setup-gradle` ne fait pas.**
      #
      # Il met en cache `~/.gradle`, jamais `~/.konan` — or c'est là que vivent
      # le compilateur Kotlin/Native téléchargé et, surtout, les caches de
      # bibliothèques de plateforme qu'il reconstruit sinon à chaque run. C'est
      # le poste de dépense invisible des deux étapes de lien ci-dessous.
      #
      # La clé porte les fichiers de build : eux seuls peuvent changer la
      # version de Kotlin, donc invalider ces caches. `restore-keys` laisse
      # repartir du cache précédent quand la clé exacte manque — un cache
      # partiellement à jour vaut toujours mieux qu'un répertoire vide.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'app/build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # En premier, et séparément : cette tâche compile `commonMain` **et**
      # `iosMain` en métadonnées. C'est le retour le plus rapide et le plus
      # lisible sur les erreurs de code partagé, avant que xcodebuild ne noie
      # tout dans sa propre sortie.
      #
      # `--no-daemon` conservé. Le partager entre les deux invocations aurait
      # rendu une phase de configuration, trente à soixante secondes — mais
      # `gradle.properties` porte un `-Xmx5g` obtenu après deux commits de
      # correction d'OutOfMemoryError, l'édition de liens Kotlin/Native tournant
      # dans le démon Gradle lui-même. On ne rejoue pas ce réglage-là pour une
      # minute.
      - name: Compiler le code partagé pour iOS
        run: ./gradlew :app:compileIosMainKotlinMetadata --no-daemon

      # Puis la vraie compilation native, cible appareil : c'est elle qui
      # éprouve le cinterop — CoreCrypto, Core Image, NSDateFormatter — que la
      # compilation de métadonnées ne touche pas.
      #
      # **Le lien simulateur a été retiré**, et ce n'est pas une baisse de
      # couverture. Les trois cibles iOS partagent le même source set `iosMain` :
      # ce que le simulateur aurait attrapé et que l'appareil laisse passer se
      # réduit au cinterop propre à une architecture, que ce lien-ci exerce
      # déjà. Onze minutes de runner macOS pour ce delta-là n'étaient pas un
      # échange raisonnable.
      - name: Compiler le framework Kotlin/Native (appareil)
        run: ./gradlew :app:linkDebugFrameworkIosArm64 --no-daemon

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: iosApp
        run: xcodegen generate

      # Build **appareil**, pas simulateur : c'est celui qui donne un binaire
      # installable sur un iPhone.
      #
      # L'étape de lien juste au-dessus n'est pas du travail perdu pour autant :
      # le projet Xcode lance lui-même `embedAndSignAppleFrameworkForXcode`, qui
      # résout vers cette même tâche et la retrouve à jour. Elle ne coûte donc
      # rien de plus, et sort l'erreur de compilation Kotlin de la sortie de
      # xcodebuild, où elle serait illisible.
      - name: Construire l'application iOS
        run: |
          xcodebuild build \
            -project iosApp/Moovie.xcodeproj \
            -scheme Moovie \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Un .ipa est un zip dont le seul contenu obligatoire est `Payload/<app>`.
      # Non signé : SideStore resigne à l'installation avec le certificat de
      # l'utilisateur.
      - name: Empaqueter le .ipa
        run: |
          set -e
          app=$(find build/dd/Build/Products -maxdepth 2 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "aucun .app produit"; exit 1; }
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "moovie-${GITHUB_SHA:0:7}.ipa" Payload
          ls -lh moovie-*.ipa

      # Artefact de branche, pas de release : il sert à essayer sur un vrai
      # appareil sans taguer une version. Sept jours suffisent largement.
      - name: Publier le .ipa en artefact
        uses: actions/upload-artifact@v4
        with:
          name: moovie-ipa
          path: moovie-*.ipa
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Le reste du projet ne doit pas régresser pendant le portage — mais rien ici
  # n'exige macOS.
  #
  # Ces trois tâches tournaient en fin du job iOS, donc en série derrière vingt
  # minutes de Kotlin/Native, sur le runner le plus lent à obtenir et le plus
  # cher à l'heure. En job séparé elles démarrent en même temps que lui : leur
  # durée disparaît du temps total au lieu de s'y ajouter, et le verdict
  # Android/desktop tombe en quelques minutes plutôt qu'à la toute fin.
  #
  # Le SDK Android est préinstallé sur les images `ubuntu-latest`.
  # ---------------------------------------------------------------------------
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Non-régression Android et desktop
        run: ./gradlew :app:compileKotlinDesktop :app:compileDebugKotlinAndroid :app:desktopTest --no-daemon
